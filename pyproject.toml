[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simpl-agent"
dynamic = ["version"]
description = "MCP tools for reading, checking and editing Crestron SIMPL Windows programs. Personal use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# Pinned to the MCP SDK version Q-SYS Agent already runs on this PC.
dependencies = [
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
simpl-agent-mcp = "simpl_agent.server:main"

[tool.setuptools.dynamic]
version = { attr = "simpl_agent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simpl_agent = ["catalog/verified_simple_codes.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not corpus'"
markers = ["corpus: slow tests over the local SIMPL corpus (run with -m corpus)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
